<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon</title>
    <style>
        /* Modernes Farbschema & Schrift */
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #E1306C; /* Instagram Pink */
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            animation: fadeIn 1.5s ease-out;
        }

        /* Platzhalter für dein Logo */
        .logo {
            max-width: 180px;
            height: auto;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .social-link {
            display: inline-block;
            transition: transform 0.3s ease, opacity 0.3s ease;
            text-decoration: none;
            color: var(--text-color);
        }

        .social-link:hover {
            transform: scale(1.1);
            color: var(--accent-color);
        }

        /* SVG Icon Style */
        .instagram-icon {
            width: 35px;
            height: 35px;
            fill: currentColor;
        }

        /* Animation beim Laden */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Anpassung */
        @media (max-width: 600px) {
            h1 { font-size: 1.2rem; }
            .logo { max-width: 140px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="logo.png" alt="Brand Logo" class="logo">
        
        <h1>Coming Soon</h1>

        <a href="https://www.instagram.com/xhazelcoal" target="_blank" class="social-link" aria-label="Instagram">
