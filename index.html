<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-HAZEL | Shisha Charcoal</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-orange: #ff8c00; /* Das Orange aus deinem Logo */
            --font-impact: 'Impact', 'Arial Black', sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow-y: auto;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            animation: fadeIn 1.2s ease-out;
        }

        h1 {
            font-family: var(--font-impact);
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin: 0 0 30px 0;
            color: var(--accent-orange);
            text-shadow: 0px 4px 10px rgba(255, 140, 0, 0.3);
        }

        .logo {
            max-width: 320px;
            width: 100%;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.1));
        }

        .info-text {
            font-family: var(--font-impact);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .origin {
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 30px;
            display: block;
        }

        .contact-mail {
            display: block;
            color: var(--text-color);
            text-decoration: none;
            font-size: 1.1rem;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--accent-orange);
            display: inline-block;
            padding-bottom: 5px;
            transition: 0.3s;
        }

        .contact-mail:hover {
            color: var(--accent-orange);
        }

        .social-link {
            display: inline-block;
            transition: transform 0.3s ease;
            color: var(--accent-orange);
        }

        .social-link:hover {
            transform: scale(1.2);
        }

        .instagram-icon {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .info-text { font-size: 1.2rem; }
            .logo { max-width: 250px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Coming Soon</h1>

        <img src="IMG_7934.jpeg" alt="X-HAZEL Logo" class="logo">
        
        <div class="info-text">
            Shisha Hazelnut Charcoal
        </div>
        <span class="origin">Made in Turkey</span>

        <a href="mailto:Sales@x-hazel.com" class="contact-mail">Sales@x-hazel.com</a>
        
        <br>

        <a href="https://www.instagram.com/xhazelcoal" target="_blank" class="social-link" aria-label="Instagram">
            <svg class="instagram-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 1.366.062 2.633.335 3.608 1.31.975.975 1.248 2.242 1.31 3.608.058 1.266.07 1.646.07 4.85s-.012 3.584-.07 4.85c-.062 1.366-.335 2.633-1.31 3.608-.975.975-2.242 1.248-3.608 1.31-1.266.058-1.646.07-4.85.07s-3.584-.012-4.85-.07c-1.366-.062-2.633-.335-3.608-1.31-.975-.975-1.248-2.242-1.31-3.608-.058-1.266-.07-1.646-.07-4.85s.012-3.584.07-4.85c.062-1.366.335-2.633 1.31-3.608.975-.975 2.242-1.248 3.608-1.31 1.266-.058 1.646-.07 4.85-.07M12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
            </svg>
        </a>
    </div>

</body>
</html>
