<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - x-hazel</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --accent-color: #E1306C;
            --secondary-text: #666666;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
        }

        .container {
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 1.2s ease-out;
            max-width: 400px;
        }

        h1 {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 50px;
            color: var(--secondary-text);
        }

        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 35px;
        }

        .info-box {
            margin-bottom: 30px;
        }

        .product-title {
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            display: block;
        }

        .origin {
            font-size: 0.9rem;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary-text);
        }

        .email-link {
            display: inline-block;
            margin-top: 20px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            border-bottom: 1px solid #ddd;
            transition: all 0.3s;
            padding-bottom: 2px;
        }

        .email-link:hover {
            border-bottom-color: var(--text-color);
            opacity: 0.7;
        }

        .social-link {
            display: inline-block;
            margin-top: 45px;
            transition: transform 0.3s ease;
            color: var(--text-color);
        }

        .social-link:hover {
            transform: scale(1.15);
            color: var(--accent-color);
        }

        .instagram-icon {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 0.9rem; letter-spacing: 4px; }
            .logo { max-width: 180px; }
            .product-title { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Coming Soon</h1>

        <img src="logo.png" alt="x-hazel Logo" class="logo">
        
        <div class="info-box">
            <span class="product-title">shisha hazelnut charcoal</span>
            <span class="origin">made in turkey</span>
        </div>

        <a href="mailto:Sales@x-hazel.com" class="email-link">Sales@x-hazel.com</a>

        <br>

        <a href="https://www.instagram.com/xhazelcoal" target="_blank" class="social-link" aria-label="Instagram">
            <svg class="instagram-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        </a>
    </div>

</body>
</html>
